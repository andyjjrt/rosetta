services:
  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4.2.2-alpine
    restart: unless-stopped
    environment:
      _JAVA_OPTIONS: "-Xmx6G -Djava.net.preferIPv4Stack=true"
    volumes:
      - ./application.yml:/opt/Lavalink/application.yml
    ports:
      - "2333:2333"

  lavalink-1:
    image: ghcr.io/lavalink-devs/lavalink:4.2.2-alpine
    restart: unless-stopped
    environment:
      _JAVA_OPTIONS: "-Xmx6G -Djava.net.preferIPv4Stack=true"
    volumes:
      - ./application.yml:/opt/Lavalink/application.yml
    ports:
      - "2334:2333"

networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: "1280"
