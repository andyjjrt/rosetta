[project]
name = "rosetta"
version = "0.12.0"
description = "A discord music bot, with other cool stuffs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "discord.py>=2.4.0",
    "ffmpeg-python>=0.2.0",
    "kubernetes>=31.0.0",
    "langfuse>=3.6.1",
    "lava-lyra>=1.6.1",
    "pydantic-ai-slim[openai]>=0.0.46",
    "pydantic-settings>=2.12.0",
    "pynacl>=1.5.0",
    "pyyaml>=6.0.3",
    "rich>=14.2.0",
    "yt-dlp[default]>=2025.11.12",
]

[dependency-groups]
dev = [
    "pre-commit>=4.3.0",
    "ruff>=0.11.2",
]
docs = [
    "mkdocs-material>=9.6.0",
]
