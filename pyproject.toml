[project]
name = "rosetta"
version = "0.6.1"
description = "A discord music bot, with other cool stuffs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ffmpeg-python>=0.2.0",
    "langfuse>=3.6.1",
    "py-cord==2.6.1",
    "pydantic-ai-slim[openai]>=0.0.46",
    "pynacl>=1.5.0",
    "pyyaml>=6.0.3",
    "rich>=14.2.0",
    "yt-dlp>=2025.10.22",
]

[dependency-groups]
dev = [
    "pre-commit>=4.3.0",
    "ruff>=0.11.2",
]
