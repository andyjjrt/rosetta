[project]
name = "rosetta"
version = "0.6.1"
description = "A discord music bot, with other cool stuffs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.12",
    "ffmpeg-python>=0.2.0",
    "ollama>=0.4.7",
    "py-cord>=2.6.1",
    "pydantic-ai-slim[openai]>=0.0.46",
    "pynacl>=1.5.0",
    "requests>=2.32.3",
    "yt-dlp>=2025.3.27",
]

[dependency-groups]
dev = [
    "ruff>=0.11.2",
]
