; Bot, langfuse, and llm configs can also be set via environment variables:
; BOT_TOKEN, BOT_CLIENT_ID
; LANGFUSE_PUBLIC_KEY, LANGFUSE_SECRET_KEY, LANGFUSE_HOST
; LLM_BASE_URL, LLM_API_KEY, LLM_DEFAULT_MODEL
;
; Note: Emojis are automatically fetched from the bot's application emojis.
; Upload emojis with these names to your Discord application:
; success, error, youtube, progress_start, progress, progress_mix,
; progress_fill, progress_end, progress_fill_end, progress_start_0

[bot]
TOKEN=xxx
CLIENT_ID=xxx

[llm]
BASE_URL=xxx
API_KEY=xxx
DEFAULT_MODEL=xxx

[langfuse]
PUBLIC_KEY=xxx
SECRET_KEY=xxx
HOST=xxx