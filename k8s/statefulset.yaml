apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rosetta-statefulset
spec:
  serviceName: "rosetta"
  replicas: 1
  selector:
    matchLabels:
      app: rosetta
  template:
    metadata:
      labels:
        app: rosetta
    spec:
      containers:
        - name: rosetta
          image: ghcr.io/andyjjrt/rosetta:0.9.0-beta2
          env:
            - name: SHARD_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name  # StatefulSet pods have predictable names
            - name: TOTAL_SHARDS
              value: "1"
          resources:
            requests:
              cpu: "500m"       # 0.5 CPU guaranteed
              memory: "512Mi"   # 512Mi guaranteed
            limits:
              cpu: "1"          # max 1 CPU
              memory: "1Gi"     # max 1Gi
          volumeMounts:
            - name: music
              mountPath: /app/music
            - name: config
              mountPath: /app/config.ini
              subPath: config.ini
            - name: mygo-ave-video
              mountPath: /app/mygo-ave-video
              readOnly: true
      volumes:
        - name: music
          persistentVolumeClaim:
            claimName: rosetta-music-pvc
        - name: config
          configMap:
            name: rosetta-config
            items:
              - key: config.ini
                path: config.ini
        - name: mygo-ave-video
          persistentVolumeClaim:
            claimName: rosetta-video-pvc

